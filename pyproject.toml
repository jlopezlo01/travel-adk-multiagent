[project]
name = "travel-adk-multiagent"
version = "0.1.0"
description = "Laboratorio UCV: sistema multiagente de viajes con Google ADK"
authors = [{ name = "UCV - Ingeniería de Sistemas" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[tool.poetry]
packages = [{ include = "travel_assistant" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
ruff = "^0.14.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=travel_assistant --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
